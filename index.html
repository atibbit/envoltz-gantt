<title>Envoltz Gantt Dashboard v1.0.0</title>

<!--
================================================================================
  ENVOLTZ GANTT DASHBOARD — Firebase + Email/Password Auth
  Hosted on Vercel | Real-time data in Firestore
================================================================================

  SETUP INSTRUCTIONS (~15 minutes total)
  ───────────────────────────────────────

  PART 1 — CREATE FIREBASE PROJECT (skip if already done)
  ────────────────────────────────────────────────────────
  1. Go to https://console.firebase.google.com
  2. Add project → "envoltz-gantt" → Create project

  PART 2 — ENABLE EMAIL/PASSWORD SIGN-IN (2 min)
  ────────────────────────────────────────────────
  1. Firebase console → Authentication → Get started
  2. Sign-in method tab → Email/Password → Enable (top toggle only)
     Leave "Email link (passwordless)" DISABLED
  3. Save

  PART 3 — CREATE USER ACCOUNTS (1 min per user)
  ────────────────────────────────────────────────
  1. Firebase console → Authentication → Users tab
  2. Click "Add user"
  3. Enter the user's email and a temporary password
  4. Repeat for each team member who needs access
  NOTE: Users cannot sign up themselves — only accounts
        you create here can log in. This is by design.

  PART 4 — CREATE FIRESTORE DATABASE (skip if already done)
  ──────────────────────────────────────────────────────────
  1. Firebase console → Firestore Database → Create database
  2. Start in production mode → select region → Enable
  3. Rules tab → replace with:

     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /tasks/{taskId} {
           allow read, write: if request.auth != null;
         }
         match /team/{memberId} {
           allow read, write: if request.auth != null;
         }
       }
     }

  4. Publish

  PART 5 — GET FIREBASE CONFIG & PASTE BELOW (2 min)
  ────────────────────────────────────────────────────
  1. Firebase console → gear icon → Project settings → Your apps
  2. Click </> to add a web app if you haven't yet
  3. Copy the firebaseConfig values into the CONFIG block below

  PART 6 — DEPLOY TO VERCEL (skip if already done)
  ──────────────────────────────────────────────────
  1. Rename this file to index.html
  2. Push to GitHub repo → import to vercel.com → Deploy
  3. Done — your Vercel URL is the live app

  MANAGING USERS GOING FORWARD:
  ──────────────────────────────
  Add users:    Firebase console → Authentication → Users → Add user
  Remove users: Click the ⋮ menu next to the user → Delete user
  Reset password: Click the ⋮ menu → Reset password (sends email)
  Users can also reset their own password from the login screen.

================================================================================
-->

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-page:#f0f0ee;--bg-card:#ffffff;--bg-surface:#fafaf8;--bg-input:#ffffff;
  --border-main:#d8d7d3;--border-soft:#e8e7e4;--border-input:#d0d0cc;
  --text-primary:#1a1a1a;--text-secondary:#555;--text-muted:#888;--text-faint:#aaa;
  --row-hover:#f5f5f2;--row-hl:#fff8f0;--row-dim:.3;
  --filter-bg:#fafaf8;--notice-bg:#f8f8f6;--person-row:#f8f8f6;
  --footer-bg:#111111;--footer-text:#777;--footer-accent:#FE7400;
  --shadow:0 6px 20px rgba(0,0,0,.12);
}
[data-theme="dark"]{
  --bg-page:#111112;--bg-card:#1c1c1e;--bg-surface:#232325;--bg-input:#2a2a2c;
  --border-main:#3a3a3c;--border-soft:#2c2c2e;--border-input:#3a3a3c;
  --text-primary:#f0f0ee;--text-secondary:#b0b0ae;--text-muted:#777;--text-faint:#444;
  --row-hover:#252527;--row-hl:#2a1f10;--row-dim:.2;
  --filter-bg:#1c1c1e;--notice-bg:#232325;--person-row:#232325;
  --footer-bg:#000000;--footer-text:#555;
  --shadow:0 6px 24px rgba(0,0,0,.5);
}
html,body{min-height:100%;font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:var(--text-primary);background:#e8e8e6}
.app-wrap{display:flex;flex-direction:column;min-height:100vh;max-width:1400px;margin:0 auto;background:var(--bg-page)}

/* ── Header ── */
.ev-header{background:#000;padding:10px 20px;display:flex;align-items:center;gap:14px}
.ev-hl{display:flex;align-items:center;gap:14px;flex:1}
.hdiv{width:1px;height:28px;background:#444;flex-shrink:0}
.htag{font-size:12px;font-weight:500;color:#aaa;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.hright{display:flex;align-items:center;gap:10px}
.admin-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#1D9E75;background:rgba(29,158,117,.15);padding:4px 10px;border-radius:20px;font-weight:500;border:1px solid rgba(29,158,117,.3)}
.admin-dot{width:6px;height:6px;border-radius:50%;background:#1D9E75}
.user-chip{display:flex;align-items:center;gap:7px;font-size:11px;color:#aaa}
.user-initials{width:26px;height:26px;border-radius:50%;background:#FE7400;color:#000;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:#666;padding:3px 9px;border:1px solid #333;border-radius:20px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s}
.sync-dot.live{background:#1D9E75}
.sync-dot.saving{background:#FE7400;animation:blink .6s infinite}
.sync-dot.error{background:#E24B4A}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hbtn{padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px;background:transparent;border:1px solid #444;color:#bbb}
.hbtn:hover{background:#222;color:#fff}
.hbtn-out{border-color:#854F0B;color:#FE7400}.hbtn-out:hover{background:rgba(254,116,0,.1)}
.hbtn-sm{padding:4px 10px;font-size:11px}

/* ── Tabs ── */
.topbar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0;background:#000;align-items:flex-end}
.tab{padding:7px 16px;border:1px solid #444;border-bottom:none;border-radius:4px 4px 0 0;background:transparent;cursor:pointer;font-size:13px;color:#999}
.tab.active{background:#FE7400;color:#000;border-color:#FE7400;font-weight:500}
.tab:hover:not(.active){background:#222;color:#fff}
.tbr{margin-left:auto;display:flex;gap:7px;align-items:center;padding-bottom:2px}
.abtn{padding:6px 14px;border:1px solid #FE7400;border-radius:4px;background:transparent;cursor:pointer;font-size:12px;color:#FE7400;font-weight:500}
.abtn:hover{background:#FE7400;color:#000}
.mbtn{padding:6px 12px;border:1px solid #444;border-radius:4px;background:transparent;cursor:pointer;font-size:12px;color:#999}
.mbtn:hover{background:#222;color:#fff}

/* ── Content ── */
.content{background:var(--bg-card);border-left:.5px solid var(--border-main);border-right:.5px solid var(--border-main);padding:20px;flex:1}
.gpage{display:none}.gpage.active{display:block}

/* ── Sign-in Screen ── */
.signin-screen{background:var(--bg-card);border-left:.5px solid var(--border-main);border-right:.5px solid var(--border-main);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:60px 20px}
.signin-card{width:100%;max-width:360px;background:var(--bg-card);border:.5px solid var(--border-main);border-radius:12px;padding:2rem;box-shadow:var(--shadow)}
.signin-logo{display:flex;justify-content:center;margin-bottom:1.5rem}
.signin-title{font-size:16px;font-weight:500;color:var(--text-primary);margin-bottom:6px;text-align:center}
.signin-sub{font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:1.5rem;line-height:1.5}
.signin-field{margin-bottom:12px}
.signin-field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.signin-field input{width:100%;padding:9px 12px;font-size:13px;border:.5px solid var(--border-input);border-radius:6px;background:var(--bg-input);color:var(--text-primary);outline:none;transition:border-color .15s}
.signin-field input:focus{border-color:#FE7400}
.signin-btn{width:100%;padding:10px;background:#FE7400;color:#000;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
.signin-btn:hover{background:#e56900}
.signin-btn:disabled{opacity:.5;cursor:not-allowed}
.signin-error{font-size:12px;color:#A32D2D;background:#FCEBEB;padding:8px 12px;border-radius:6px;margin-bottom:12px;display:none;line-height:1.4}
.signin-error.show{display:block}
.forgot-link{display:block;text-align:center;font-size:11px;color:var(--text-muted);margin-top:12px;cursor:pointer;text-decoration:underline}
.forgot-link:hover{color:var(--text-primary)}
.reset-success{font-size:12px;color:#0F6E56;background:#E1F5EE;padding:8px 12px;border-radius:6px;margin-bottom:12px;display:none;line-height:1.4}
.reset-success.show{display:block}

/* ── Loading overlay ── */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.loading-overlay.hidden{display:none}
.spinner{width:38px;height:38px;border:3px solid #333;border-top-color:#FE7400;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#fff;font-size:14px}

/* ── Filter bar ── */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;background:var(--filter-bg);border:.5px solid var(--border-soft);border-radius:8px;margin-bottom:14px}
.fbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;font-weight:500}
.fsel{font-size:12px;padding:4px 7px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-input);color:var(--text-primary);cursor:pointer}
.fsel:focus{outline:none;border-color:#FE7400}
.fdiv{width:1px;height:18px;background:var(--border-soft)}
.fgrp{display:flex;align-items:center;gap:5px}
.fclear{font-size:11px;color:#FE7400;background:none;border:none;cursor:pointer;text-decoration:underline}
.fadot{width:7px;height:7px;border-radius:50%;background:#FE7400;display:inline-block;margin-left:3px;vertical-align:middle}

/* ── Gantt ── */
.gwrap{overflow-x:auto;margin-bottom:1.5rem}
.gant{min-width:700px;width:100%}
.ghdr{display:flex;border-bottom:1.5px solid #FE7400;padding-bottom:5px;margin-bottom:0}
.glbl{width:180px;min-width:180px;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.gdates{flex:1;display:flex}
.gdcell{font-size:10px;color:var(--text-faint);text-align:center;border-left:1px solid var(--border-soft)}
.gbody{position:relative}
.ggrid{position:absolute;inset:0;left:180px;display:flex;pointer-events:none;z-index:0}
.ggcol{flex:1;border-left:1px solid var(--border-soft)}
.ggcol:nth-child(odd){background:rgba(254,116,0,.025)}
.ggcol:nth-child(even){background:rgba(128,128,128,.018)}
.grow{display:flex;align-items:center;height:34px;border-bottom:.5px solid var(--border-soft);position:relative;z-index:1}
.grow.rhl{background:var(--row-hl)}
.grow:hover{background:var(--row-hover)}
.gtlbl{width:180px;min-width:180px;font-size:12px;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-primary)}
.gtrack{flex:1;position:relative;height:22px}
.gbar{position:absolute;height:100%;border-radius:2px;display:flex;align-items:center;padding:0 6px;font-size:10px;overflow:hidden;white-space:nowrap;font-weight:500;z-index:2;cursor:pointer;transition:opacity .18s,filter .18s}
.gbar:hover{filter:brightness(1.12)}
.gbar.bdim{opacity:.14;filter:grayscale(1)}
.gbar.proj-hl{outline:2px solid #fff;outline-offset:1px;filter:brightness(1.08)}
.gbar.proj-dim{opacity:.18;filter:grayscale(.8)}
.grow.proj-row-hl{background:var(--row-hl)}
tr.proj-row-hl td{background:var(--row-hl)}
tr.proj-row-dim{opacity:.3}
.gbar.bhl{outline:2.5px solid #FE7400;outline-offset:1px}
.p-low{background:#1D9E75;color:#fff}.p-medium{background:#378ADD;color:#fff}.p-high{background:#FE7400;color:#000}.p-urgent{background:#E24B4A;color:#fff}

/* ── Popup ── */
.popup{position:fixed;z-index:500;background:var(--bg-card);border:1px solid var(--border-input);border-radius:10px;padding:12px 14px;min-width:220px;max-width:270px;box-shadow:var(--shadow);pointer-events:none;display:none}
.popup.vis{display:block}.popup.pin{pointer-events:auto;display:block}
.pphdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:7px}
.pptit{font-size:13px;font-weight:500;color:var(--text-primary);line-height:1.3;flex:1}
.ppx{background:none;border:none;cursor:pointer;color:var(--text-faint);font-size:15px;line-height:1;padding:0 2px}.ppx:hover{color:var(--text-primary)}
.ppdiv{border:none;border-top:.5px solid var(--border-soft);margin:5px 0}
.pprow{display:flex;gap:6px;margin-bottom:4px;align-items:flex-start;font-size:12px}
.pplbl{color:var(--text-muted);min-width:66px;flex-shrink:0;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.ppval{color:var(--text-primary);flex:1;line-height:1.4}
.pbdg{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;margin-right:3px;margin-bottom:2px}
.pb-low{background:#E1F5EE;color:#0F6E56}.pb-medium{background:#E6F1FB;color:#185FA5}.pb-high{background:#FFF0E0;color:#994500}.pb-urgent{background:#FCEBEB;color:#A32D2D}
.pb-eng{background:#EEEDFE;color:#3C3489}.pb-prod{background:#E1F5EE;color:#0F6E56}.pb-proc{background:#FAEEDA;color:#854F0B}

/* ── Table ── */
.sdiv{margin:1.5rem 0 .75rem;padding-bottom:.5rem;border-bottom:1.5px solid #FE7400}
.stit{font-size:12px;font-weight:500;color:#FE7400;text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 8px;font-weight:500;border-bottom:2px solid #FE7400;color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:5px 8px;border-bottom:.5px solid var(--border-soft);vertical-align:top;color:var(--text-primary)}
tr.thl td{background:var(--row-hl)}
tr.tdim{opacity:var(--row-dim)}
input[type=text],input[type=date]{font-size:11px;padding:3px 5px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-input);color:var(--text-primary);width:100%}
input[type=text]:read-only,input[type=date]:read-only{background:var(--bg-surface);color:var(--text-muted);cursor:default;border-color:var(--border-soft)}
input:focus:not(:read-only){outline:none;border-color:#FE7400}
select{font-size:11px;padding:3px 4px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-input);color:var(--text-primary)}
select:disabled{background:var(--bg-surface);color:var(--text-muted);cursor:default}
select:focus{outline:none;border-color:#FE7400}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:500;white-space:nowrap}
.badge-low{background:#E1F5EE;color:#0F6E56}.badge-medium{background:#E6F1FB;color:#185FA5}.badge-high{background:#FFF0E0;color:#994500}.badge-urgent{background:#FCEBEB;color:#A32D2D}
.badge-eng{background:#EEEDFE;color:#3C3489}.badge-prod{background:#E1F5EE;color:#0F6E56}.badge-proc{background:#FAEEDA;color:#854F0B}
.badge-ns{background:#f0f0ee;color:#888;border:1px solid #ddd}
.badge-ip{background:#E6F1FB;color:#185FA5;border:1px solid #b8d4f5}
.badge-cp{background:#E1F5EE;color:#0F6E56;border:1px solid #a8dfc8}
.gbar.completed{opacity:.28;filter:grayscale(.9)}
.trow-completed td{opacity:.45}
.trow-completed td input,.trow-completed td select{color:var(--text-faint)}
.completed-sdiv{margin:1.5rem 0 .75rem;padding-bottom:.5rem;border-bottom:1.5px solid #888}
.completed-stit{font-size:12px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.08em}
.status-sel{font-size:11px;padding:3px 5px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-input);color:var(--text-primary);cursor:pointer;min-width:98px}
.status-sel:disabled{background:var(--bg-surface);color:var(--text-muted);cursor:default}
.status-sel:focus{outline:none;border-color:#FE7400}
.status-sel.s-ns{border-color:#ccc;color:#888}
.status-sel.s-ip{border-color:#b8d4f5;color:#185FA5;background:rgba(55,138,221,.06)}
.status-sel.s-cp{border-color:#a8dfc8;color:#0F6E56;background:rgba(29,158,117,.06)}
.dbtn{background:none;border:none;cursor:pointer;color:var(--text-faint);font-size:13px;padding:0 3px}.dbtn:hover{color:#E24B4A}

/* ── Multi-select ── */
.msw{position:relative}
.msbox{min-height:26px;border:.5px solid var(--border-input);border-radius:3px;padding:2px 5px;cursor:pointer;display:flex;flex-wrap:wrap;gap:2px;align-items:center;background:var(--bg-input)}
.msbox.lck{background:var(--bg-surface);cursor:default;border-color:var(--border-soft)}
.msbox.open{border-color:#FE7400}
.mspill{display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:500;white-space:nowrap}
.mspx{cursor:pointer;opacity:.6;font-size:10px;line-height:1}.mspx:hover{opacity:1}
.msdd{position:fixed;background:var(--bg-card);border:.5px solid var(--border-input);border-radius:8px;z-index:9999;max-height:200px;overflow-y:auto;display:none;min-width:180px;box-shadow:var(--shadow)}
.msdd.open{display:block}
.msopt{padding:5px 9px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text-primary)}
.msopt:hover{background:var(--row-hover)}
.msopt input[type=checkbox]{accent-color:#FE7400;width:12px;height:12px;flex-shrink:0}
.msph{font-size:10px;color:var(--text-faint)}

/* ── Modals ── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:600}
.mbox{background:var(--bg-card);border:.5px solid var(--border-input);border-radius:12px;padding:1.5rem;width:420px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mbox-sm{width:330px}
.mhdr{display:flex;align-items:center;gap:10px;margin-bottom:1.1rem}
.obar{width:4px;height:20px;background:#FE7400;border-radius:2px}
.kbar{width:4px;height:20px;background:#555;border-radius:2px}
.mhdr h3{font-size:14px;font-weight:500;color:var(--text-primary)}
.mf{margin-bottom:11px}
.mf label{display:block;font-size:10px;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.mf input,.mf select{width:100%;padding:6px 8px;font-size:13px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-input);color:var(--text-primary)}
.mf input:focus,.mf select:focus{outline:none;border-color:#FE7400}
.mms{border:.5px solid var(--border-input);border-radius:3px;max-height:120px;overflow-y:auto;background:var(--bg-input)}
.mms label{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:12px;cursor:pointer;color:var(--text-primary)}
.mms label:hover{background:var(--row-hover)}
.mms input[type=checkbox]{accent-color:#FE7400}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:.9rem}
.bprim{padding:7px 16px;border:none;border-radius:3px;background:#FE7400;color:#000;cursor:pointer;font-size:12px;font-weight:500}.bprim:hover{background:#e56900}
.bdark{padding:7px 16px;border:none;border-radius:3px;background:#222;color:#fff;cursor:pointer;font-size:12px;font-weight:500}.bdark:hover{background:#000}
.bcanc{padding:7px 16px;border:.5px solid var(--border-input);border-radius:3px;background:transparent;color:var(--text-primary);cursor:pointer;font-size:12px}
.lerr{font-size:12px;color:#A32D2D;background:#FCEBEB;padding:6px 10px;border-radius:3px;margin-bottom:9px;display:none}.lerr.show{display:block}
.plist{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;max-height:260px;overflow-y:auto}
.prow{display:flex;align-items:center;gap:7px;padding:6px 8px;border:.5px solid var(--border-soft);border-radius:8px;background:var(--person-row)}
.pavt{width:28px;height:28px;border-radius:50%;background:#FE7400;color:#000;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pname{flex:1;font-size:12px;color:var(--text-primary)}
.pei{flex:1;font-size:12px;padding:2px 5px;border:.5px solid #FE7400;border-radius:3px;background:var(--bg-input);color:var(--text-primary);outline:none}
.pemail{flex:1.4;font-size:11px;padding:2px 6px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-surface);color:var(--text-muted);outline:none;font-style:italic}
.pemail:focus{border-color:#FE7400;background:var(--bg-input);color:var(--text-primary);font-style:normal}
.pemail-lbl{font-size:9px;color:var(--text-faint);white-space:nowrap}
.mytasks-empty{padding:2.5rem 1rem;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.7}
.mytasks-badge{display:inline-block;padding:3px 10px;background:rgba(254,116,0,.12);color:#FE7400;border-radius:20px;font-size:11px;font-weight:500;border:1px solid rgba(254,116,0,.3)}
.aprow{display:flex;gap:6px;margin-top:4px}
.aprow input{flex:1;padding:6px 8px;font-size:12px;border:.5px solid var(--border-input);border-radius:3px;background:var(--bg-input);color:var(--text-primary)}
.aprow input:focus{outline:none;border-color:#FE7400}
.badd{padding:6px 12px;border:none;border-radius:3px;background:#FE7400;color:#000;cursor:pointer;font-size:12px;font-weight:500}
.spnote{font-size:11px;color:var(--text-muted);margin-bottom:9px;padding:7px 9px;border:.5px solid var(--border-soft);border-radius:7px;background:var(--notice-bg);line-height:1.5}
.vonote{font-size:11px;color:var(--text-muted);padding:6px 9px;background:var(--notice-bg);border:.5px solid var(--border-soft);border-radius:7px;margin-bottom:10px}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.toast{position:fixed;bottom:24px;right:24px;background:#222;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;z-index:900;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}

/* ── Footer ── */
.ev-footer{background:var(--footer-bg);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-top:2px solid #FE7400}
.fl{display:flex;flex-direction:column;gap:2px}
.fver{font-size:11px;color:var(--footer-accent);font-weight:500;letter-spacing:.04em}
.fpub{font-size:10px;color:var(--footer-text)}
.fupdated{font-size:10px;color:var(--footer-text)}
.fr{display:flex;align-items:center;gap:10px}
.tlbl{font-size:11px;color:var(--footer-text);letter-spacing:.04em;text-transform:uppercase}
.tswitch{position:relative;display:inline-block;width:44px;height:24px;cursor:pointer;flex-shrink:0}
.tswitch input{opacity:0;width:0;height:0}
.tslider{position:absolute;inset:0;background:#444;border-radius:24px;transition:background .25s}
.tslider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s}
.tswitch input:checked+.tslider{background:#FE7400}
.tswitch input:checked+.tslider:before{transform:translateX(20px);background:#000}
.leg-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.leg-i{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted)}
.leg-sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.empty{padding:2rem;text-align:center;color:var(--text-faint);font-size:13px}
.tnum{color:var(--text-faint);font-size:11px;font-weight:500;min-width:24px;text-align:right;padding-right:4px}
</style>

  if(!user || !user.email) return false;
  return ADMIN_EMAILS.map(e => e.toLowerCase().trim())
                     .includes(user.email.toLowerCase().trim());

window.toggleTheme = d => {
  document.getElementById('app-wrap').setAttribute('data-theme', d ? 'dark' : '');

  try { localStorage.setItem('ev-gantt-theme', d ? 'dark' : 'light'); } catch(e) {}
};

function showLoad(m) { document.getElementById('loading-text').textContent = m; document.getElementById('loading-overlay').classList.remove('hidden'); }
function hideLoad()  { document.getElementById('loading-overlay').classList.add('hidden'); }
function setSyncStatus(state, label) {
  document.getElementById('sync-dot').className = 'sync-dot ' + (state||'');

}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function markUpd() {
  const el = document.getElementById('last-upd');
  if(el) el.textContent = 'Last updated: ' + new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
}
function inits(n)    { return n.trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2); }
function getProjs()  { return [...new Set(tasks.map(t=>t.project))].sort(); }
function pcol(p)     { const ps=getProjs(); return PCOLS[ps.indexOf(p)%PCOLS.length]; }
function teamNames() { return team.map(m=>m.name); }
// Returns the team member name linked to the signed-in user's email, or null
function myMemberName() {
  if(!currentUser) return null;
  const me = team.find(m => (m.email||'').toLowerCase().trim() === currentUser.email.toLowerCase().trim());
  return me ? me.name : null;
}
// Parse a YYYY-MM-DD string as LOCAL midnight (avoids UTC timezone shift)
function parseDate(s) {
  if(!s) return new Date();
  if(typeof s === 'string') return new Date(s + 'T00:00:00');
  return new Date(s);
}
function dr(tl) {
  if(!tl.length) return {min:new Date(),max:new Date(),days:30,cols:30};
  const ds=tl.flatMap(t=>[parseDate(t.start),parseDate(t.end)]);
  let mn=new Date(Math.min(...ds)), mx=new Date(Math.max(...ds));
  mn.setDate(mn.getDate()-2); mx.setDate(mx.getDate()+2);
  const days=Math.ceil((mx-mn)/864e5);
  return {min:mn,max:mx,days,cols:Math.min(days,60)};
}
function fd(d) { if(typeof d==='string')d=new Date(d+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fs(d) { if(typeof d==='string')d=new Date(d+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function tpf(t) {
  if(filt.priority && t.priority!==filt.priority) return false;
  if(filt.type     && !(t.types||[]).includes(filt.type)) return false;
  if(filt.assignee && !(t.assignees||[]).includes(filt.assignee)) return false;
  if(filt.status   && (t.status||'not_started')!==filt.status) return false;
  return true;
}
// Separate check: does this task match the project highlight filter?
function tprojMatch(t) {
  if(!filt.project) return null; // null = no project filter active
  return t.project === filt.project;
}
function hasF() { return !!(filt.priority||filt.type||filt.assignee||filt.project||filt.status); }

window.doSignIn = async () => {
  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-pass').value;
  const errEl    = document.getElementById('signin-error');
  const btn      = document.getElementById('signin-btn');

  errEl.classList.remove('show');
  document.getElementById('reset-success').classList.remove('show');

  if(!email || !password) {
    errEl.textContent = 'Please enter your email and password.';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged handles the rest
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Sign in';
    const msgs = {
      'auth/invalid-email':         'Invalid email address.',
      'auth/user-not-found':        'No account found with this email.',
      'auth/wrong-password':        'Incorrect password. Try again.',
      'auth/invalid-credential':    'Incorrect email or password.',
      'auth/too-many-requests':     'Too many attempts. Try again in a few minutes.',
      'auth/user-disabled':         'This account has been disabled.',
      'auth/network-request-failed':'Network error. Check your connection.'
    };
    errEl.textContent = msgs[e.code] || 'Sign-in failed. Please try again.';
    errEl.classList.add('show');
  }
};

window.doForgotPassword = async () => {
  const email  = document.getElementById('si-email').value.trim();
  const errEl  = document.getElementById('signin-error');
  const succEl = document.getElementById('reset-success');
  errEl.classList.remove('show');
  succEl.classList.remove('show');

  if(!email) {
    errEl.textContent = 'Enter your email address above, then click "Forgot password?"';
    errEl.classList.add('show');

  }
  try {

    succEl.classList.add('show');
  } catch(e) {

    errEl.classList.add('show');
  }
};

// ── Firestore real-time listeners ─────────────────────────────
function startListeners() {
  showLoad('Loading project data...');
  setSyncStatus('', 'Loading...');

  // Tasks — try ordered first, fall back to unordered if index missing
  function attachTasksListener(ordered=true) {
    const tasksQ = ordered
      ? query(collection(db,'tasks'), orderBy('createdAt','asc'))
      : collection(db,'tasks');
    unsubTasks = onSnapshot(tasksQ, snap => {
      tasks = snap.docs.map(d => ({id:d.id, ...d.data()}));
      // Sort client-side by createdAt if we have it
      tasks.sort((a,b)=>{
        const at = a.createdAt?.toMillis?.()||0;
        const bt = b.createdAt?.toMillis?.()||0;
        return at - bt;
      });
      markUpd(); render();
      setSyncStatus('live','Live');
      hideLoad();
    }, err => {
      console.error('Tasks listener error:', err.code, err.message);
      if(ordered && (err.code==='failed-precondition'||err.message?.includes('index'))) {
        // Missing Firestore index — retry without orderBy
        console.warn('Missing index — retrying without orderBy');
        if(unsubTasks) { unsubTasks(); unsubTasks=null; }
        attachTasksListener(false);
      } else if(err.code==='permission-denied') {
        setSyncStatus('error','Permission denied');
        showErrorBanner('Firestore permission denied. Check your security rules in the Firebase console — make sure authenticated users can read/write the tasks collection.');
        hideLoad();
      } else {
        setSyncStatus('error','Sync error — check console');
        showErrorBanner('Could not load tasks: ' + (err.message||err.code));
        hideLoad();
      }
    });
  }
  attachTasksListener(true);

  // Team — try ordered first, fall back to unordered if index missing
  function attachTeamListener(ordered=true) {
    const teamQ = ordered
      ? query(collection(db,'team'), orderBy('name','asc'))
      : collection(db,'team');
    unsubTeam = onSnapshot(teamQ, snap => {
      team = snap.docs.map(d => ({id:d.id, ...d.data()}));
      team.sort((a,b)=>a.name.localeCompare(b.name));
      if(document.getElementById('plist')) rebuildPList();
      render();
    }, err => {
      console.error('Team listener error:', err.code, err.message);
      if(ordered && (err.code==='failed-precondition'||err.message?.includes('index'))) {
        if(unsubTeam) { unsubTeam(); unsubTeam=null; }
        attachTeamListener(false);
      }
      // Team errors are non-fatal — tasks still work
    });
  }
  attachTeamListener(true);
}

function showErrorBanner(msg) {
  // Inject a visible error banner into the page
  const existing = document.getElementById('err-banner');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'err-banner';
  div.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#A32D2D;color:#fff;padding:12px 20px;font-size:13px;line-height:1.5;display:flex;gap:12px;align-items:flex-start';
  div.innerHTML = `<span style="flex:1">&#9888; ${msg}</span><button onclick="document.getElementById('err-banner').remove()" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:12px;flex-shrink:0">Dismiss</button>`;
  document.body.prepend(div);
}

// ── Gantt ─────────────────────────────────────────────────────
function ganttHtml(tl) {
  if(!tl.length) return '<div class="empty">No tasks &#8212; click + Add Task to begin.</div>';
  const {min,max,days,cols}=dr(tl); const step=days/cols;
  let hdr=''; for(let i=0;i<cols;i++){const d=new Date(min);d.setDate(d.getDate()+Math.round(i*step));hdr+=`<div class="gdcell" style="flex:1;min-width:0">${fs(d)}</div>`;}
  let grid=''; for(let i=0;i<cols;i++) grid+=`<div class="ggcol"></div>`;
  let rows=tl.map(t=>{
    const ts=parseDate(t.start),te=parseDate(t.end),tot=max-min;
    const L=Math.max(0,(ts-min)/tot*100),R=Math.max(0,(max-te)/tot*100),W=Math.max(2,100-L-R);
    const tc=t.types&&t.types[0]?TCOL[t.types[0]]:null;
    const passes=tpf(t);
    const projMatch=tprojMatch(t); // null=no filter, true=match, false=no match
    // Project highlight: matching rows glow, non-matching rows fade out
    const projBarCls = projMatch===true?' proj-hl':projMatch===false?' proj-dim':'';
    const projRowCls = projMatch===true?' proj-row-hl':projMatch===false?' proj-row-dim':'';
    return `<div class="grow${pinnedId===t.id?' rhl':''}${projRowCls}" data-id="${t.id}">
      <div class="gtlbl" title="${t.name}">${t.name}</div>
      <div class="gtrack">
        <div class="gbar p-${t.priority}${!passes?' bdim':''}${pinnedId===t.id?' bhl':''}${projBarCls}${(t.status||'not_started')==='completed'?' completed':''}" data-id="${t.id}"
          style="left:${L.toFixed(1)}%;width:${W.toFixed(1)}%;${tc&&passes?'border-left:3px solid '+tc:''}"
          onmouseenter="onBE(event,'${t.id}',this)" onmouseleave="onBL()" onclick="onBC(event,'${t.id}',this)"
        >${t.name}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="gwrap"><div class="gant">
    <div class="ghdr"><div class="glbl">Task</div><div class="gdates">${hdr}</div></div>
    <div class="gbody"><div class="ggrid">${grid}</div>${rows}</div>
  </div></div>`;
}

  const os=opts.map(o=>`<div class="msopt"><input type="checkbox" ${sel.includes(o)?'checked':''} onchange="msT('${uid}','${tid}','${field}','${o.replace(/'/g,"\\'")}',this.checked)"><span>${o}</span></div>`).join('');
  return `<div class="msw" id="${uid}"><div class="msbox" onclick="msO(event,'${uid}')">${pills||'<span class="msph">Select&#8230;</span>'}</div><div class="msdd" id="${uid}-dd">${os}</div></div>`;

function tpc(t){return TBADGE[t]||'';}
function apc(){return '';}
window.msO=function(e,uid){
  if(!isAdmin)return; e.stopPropagation();
  // Close any other open dropdowns
  document.querySelectorAll('.msdd.open').forEach(d=>{
    if(d.id!==uid+'-dd'){d.classList.remove('open');const b=d.previousElementSibling;if(b)b.classList.remove('open');}
  });
  const dd=document.getElementById(uid+'-dd');
  const wrap=document.getElementById(uid);
  if(!dd||!wrap)return;
  const isOpen=dd.classList.contains('open');
  if(isOpen){dd.classList.remove('open');wrap.querySelector('.msbox').classList.remove('open');return;}
  // Position using fixed viewport coords so it escapes table overflow clipping
  const box=wrap.querySelector('.msbox');
  const r=box.getBoundingClientRect();
  const ddWidth=Math.max(r.width,190);
  // Temporarily show off-screen to measure height
  dd.style.visibility='hidden';
  dd.style.top='0px';
  dd.style.left='0px';
  dd.style.width=ddWidth+'px';
  dd.classList.add('open');
  const ddH=dd.offsetHeight;
  const spaceBelow=window.innerHeight-r.bottom-6;
  const spaceAbove=r.top-6;
  // Prefer opening downward, flip up if not enough room
  let top=(spaceBelow>=ddH||spaceBelow>=spaceAbove)?r.bottom+2:r.top-ddH-2;
  let left=r.left;
  if(left+ddWidth>window.innerWidth-6)left=window.innerWidth-ddWidth-6;
  if(left<4)left=4;
  dd.style.top=top+'px';
  dd.style.left=left+'px';
  dd.style.visibility='visible';
  box.classList.add('open');
  document.addEventListener('click',closeMs,{once:true});
};
function closeMs(){
  document.querySelectorAll('.msdd.open').forEach(d=>{
    d.classList.remove('open');
    d.style.visibility='';
    const b=d.previousElementSibling;if(b)b.classList.remove('open');
  });
}
// Close dropdowns on scroll or resize so they don't float away from their anchor

  if(!isAdmin)return;
  const t=tasks.find(t=>t.id===tid); if(!t)return;
  if(!t[field])t[field]=[];
  if(chk){if(!t[field].includes(val))t[field].push(val);}else t[field]=t[field].filter(v=>v!==val);
  const box=document.querySelector(`#${uid} .msbox`);
  if(box){const pills=(t[field]||[]).map(s=>{const cls=field==='types'?(TBADGE[s]||''):'';return`<span class="mspill ${cls}" data-v="${s}">${s} <span class="mspx" onclick="msRm(event,'${uid}','${tid}','${field}','${s.replace(/'/g,"\\'")}')">&#215;</span></span>`;}).join('');box.innerHTML=pills||'<span class="msph">Select&#8230;</span>';}
  setTimeout(()=>{const dd=document.getElementById(uid+'-dd');if(dd)dd.classList.add('open');},0);
  updateTask(tid,{[field]:t[field]});
};
window.msRm=function(e,uid,tid,field,val){
  if(!isAdmin)return; e.stopPropagation();
  const t=tasks.find(t=>t.id===tid); if(!t)return;
  t[field]=(t[field]||[]).filter(v=>v!==val);
  document.querySelectorAll(`#${uid}-dd .msopt`).forEach(o=>{if(o.querySelector('span').textContent===val){const c=o.querySelector('input');if(c)c.checked=false;}});
  const pill=document.querySelector(`#${uid} .mspill[data-v="${val}"]`); if(pill)pill.remove();
  const box=document.querySelector(`#${uid} .msbox`); if(box&&!box.querySelector('.mspill'))box.innerHTML='<span class="msph">Select&#8230;</span>';
  updateTask(tid,{[field]:t[field]});
};

// ── Table ─────────────────────────────────────────────────────
function makeRow(t, i, showProj, lk) {
  const passes=tpf(t), hl=pinnedId===t.id;
  const projMatch=tprojMatch(t);
  const projTrCls = projMatch===true?' proj-row-hl':projMatch===false?' proj-row-dim':'';
  const isComp = (t.status||'not_started')==='completed';
  const so = statusObj(t.status||'not_started');
  return `<tr data-id="${t.id}" class="${hl?'thl':(!passes?'tdim':'')}${projTrCls}${isComp?' trow-completed':''}">
    <td class="tnum">${i+1}</td>
    <td><input type="text" value="${t.name||''}" style="min-width:95px" ${lk?'readonly':''} onchange="${lk?'':` utF('${t.id}','name',this.value)`}"></td>
    ${showProj?`<td><input type="text" value="${t.project||''}" style="min-width:70px" ${lk?'readonly':''} onchange="${lk?'':` utF('${t.id}','project',this.value)`}"></td>`:''}
    <td>${msHtml(t.id,'types',TTYPES,t.types||[],tpc,lk)}</td>
    <td>${msHtml(t.id,'assignees',teamNames(),t.assignees||[],apc,lk)}</td>
    <td><input type="date" value="${t.start||''}" style="min-width:105px" ${lk?'readonly':''} onchange="${lk?'':` utF('${t.id}','start',this.value)`}"></td>
    <td><input type="date" value="${t.end||''}" style="min-width:105px" ${lk?'readonly':''} onchange="${lk?'':` utF('${t.id}','end',this.value)`}"></td>
    <td><select ${lk?'disabled':''} onchange="${lk?'':` utF('${t.id}','priority',this.value)`}">
      ${PRIOS.map(p=>`<option value="${p}"${p===t.priority?' selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}
    </select></td>
    <td><select class="status-sel ${so.cls}" ${lk?'disabled':''} onchange="${lk?'':` utF('${t.id}','status',this.value)`}">
      ${STATUSES.map(s=>`<option value="${s.val}"${(t.status||'not_started')===s.val?' selected':''}>${s.label}</option>`).join('')}
    </select></td>
    <td><button class="dbtn" onclick="${lk?'needAdmin()':` delT('${t.id}')`}" title="${lk?'Admin required':'Delete'}">&#x2715;</button></td>
  </tr>`;
}
function tblHtml(tl, showProj) {
  if(!tl.length) return '';
  const lk = !isAdmin;
  const active    = tl.filter(t=>(t.status||'not_started')!=='completed');
  const completed = tl.filter(t=>(t.status||'not_started')==='completed');
  const thead = `<thead><tr><th>#</th><th>Task</th>${showProj?'<th>Project</th>':''}<th>Type</th><th>Assigned</th><th>Start</th><th>Due</th><th>Priority</th><th>Status</th><th></th></tr></thead>`;
  const vn = lk?`<div class="vonote">&#128274; View-only &#8212; <span style="color:#FE7400;cursor:pointer;text-decoration:underline" onclick="openAdminLogin()">Admin login</span> to edit</div>`:'';
  let out = `<div class="sdiv"><span class="stit">Active tasks (${active.length})</span></div>${vn}`;
  if(active.length) {
    out += `<div style="overflow-x:auto"><table>${thead}<tbody>${active.map((t,i)=>makeRow(t,i,showProj,lk)).join('')}</tbody></table></div>`;
  } else {
    out += '<div class="empty" style="padding:1rem">No active tasks.</div>';
  }
  if(completed.length) {
    out += `<div class="completed-sdiv" style="margin-top:1.5rem"><span class="completed-stit">&#x2713; Completed (${completed.length})</span></div>`;
    out += `<div style="overflow-x:auto"><table>${thead}<tbody>${completed.map((t,i)=>makeRow(t,i,showProj,lk)).join('')}</tbody></table></div>`;
  }
  return out;
}
window.utF = (id,f,v) => {
  if(!isAdmin)return;
  const t=tasks.find(t=>t.id===id);
  if(!t) return;
  t[f]=v;
  updateTask(id,{[f]:v});
  // If status changed, update visuals immediately in-place then defer the
  // full render() so it runs AFTER the onchange event fully completes.
  // Calling render() synchronously destroys the <select> while its own
  // onchange is still on the call stack, which breaks the dropdown.
  if(f==='status') {
    const so=statusObj(v);
    const isComp=(v==='completed');
    // Update status-sel color class on the affected row immediately
    document.querySelectorAll(`tr[data-id="${id}"] .status-sel`).forEach(sel=>{
      sel.className=`status-sel ${so.cls}`;
    });
    // Update gantt bar completed class immediately
    document.querySelectorAll(`.gbar[data-id="${id}"]`).forEach(bar=>{
      bar.classList.toggle('completed', isComp);
    });
    // Update row completed dim class immediately for instant visual feedback
    document.querySelectorAll(`tr[data-id="${id}"]`).forEach(row=>{
      row.classList.toggle('trow-completed', isComp);
    });
    // Defer full render (moves row between Active/Completed sections)
    // until after this event handler returns — prevents broken DOM mid-event
    setTimeout(() => render(), 0);
  }
};
window.needAdmin = () => {
  setMC(`<div class="mbg" id="mbg" onclick="bgcl(event)"><div class="mbox mbox-sm">
    <div class="mhdr"><div class="kbar"></div><h3>Admin access required</h3></div>
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:1rem">This action requires administrator login.</p>
    <div class="mact"><button class="bcanc" onclick="setMC('')">Cancel</button><button class="bdark" onclick="setMC('');openAdminLogin()">Login</button></div>
  </div></div>`);
};

function legend(){
  return `<div class="leg-row">
    ${[['low','#1D9E75'],['medium','#378ADD'],['high','#FE7400'],['urgent','#E24B4A']].map(([p,c])=>`<span class="leg-i"><span class="leg-sw" style="background:${c}"></span>${p[0].toUpperCase()+p.slice(1)}</span>`).join('')}
    <span class="leg-i" style="padding-left:10px;border-left:.5px solid var(--border-soft);color:var(--text-faint)">Bar border = task type</span>
  </div>`;
}

// ── Render ────────────────────────────────────────────────────
function render() {
  if(!document.getElementById('content-area') ||
     document.getElementById('content-area').style.display==='none') return;
  const ps=getProjs(); const lk=!isAdmin;
  const myName  = myMemberName();
  const myTasks = myName ? tasks.filter(t=>(t.assignees||[]).includes(myName)) : [];
  let tabs=`<button class="tab${curTab==='master'?' active':''}" onclick="setTab('master')">All projects</button>`;
  tabs+=`<button class="tab${curTab==='mytasks'?' active':''}" onclick="setTab('mytasks')" style="display:flex;align-items:center;gap:5px">
    &#128100; My Tasks${myTasks.length>0?` <span style="background:${curTab==='mytasks'?'rgba(0,0,0,.2)':'#FE7400'};color:#000;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:600">${myTasks.length}</span>`:''}
  </button>`;
  ps.forEach(p=>{tabs+=`<button class="tab${curTab===p?' active':''}" onclick="setTab('${p.replace(/'/g,"\\'")}')"><span class="pdot" style="background:${pcol(p)}"></span>${p}</button>`;});
  tabs+=`<div class="tbr">
    <button class="mbtn" onclick="${lk?'needAdmin()':'openPM()'}">${lk?'&#128274; ':''}Manage people</button>
    <button class="abtn" onclick="${lk?'needAdmin()':'openAdd()'}">${lk?'&#128274; ':''}+ Add task</button>
  </div>`;
  document.getElementById('tabbar').innerHTML=tabs;

  // ── My Tasks page ──────────────────────────────────────────
  let myTasksPage = '';
  if(!myName) {
    myTasksPage = `<div class="mytasks-empty">
      <div style="font-size:28px;margin-bottom:12px">&#128100;</div>
      <strong style="color:var(--text-primary)">No account linked</strong><br>
      Ask an admin to set your login email in <strong>Manage People</strong>.<br>
      <span style="font-size:11px;color:var(--text-faint);margin-top:6px;display:block">Signed in as: ${currentUser?.email||'unknown'}</span>
    </div>`;
  } else if(myTasks.length === 0) {
    myTasksPage = `<div class="mytasks-empty">
      <div style="font-size:28px;margin-bottom:12px">&#9989;</div>
      <strong style="color:var(--text-primary)">No tasks assigned to you</strong><br>
      Tasks assigned to <span class="mytasks-badge">${myName}</span> will appear here.
    </div>`;
  } else {
    myTasksPage = `${fbarHtml(myTasks,true)}${legend()}${ganttHtml(myTasks)}${tblHtml(myTasks,true)}`;
  }

  let html=`<div class="gpage${curTab==='mytasks'?' active':''}" id="pg-mytasks">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="width:4px;height:19px;background:#FE7400;border-radius:2px;display:inline-block"></span>
      <span style="font-size:14px;font-weight:500;color:var(--text-primary)">My Tasks</span>
      ${myName?`<span class="mytasks-badge">${myName}</span>`:''}
    </div>
    ${myTasksPage}
  </div>`;
  html+=`<div class="gpage${curTab==='master'?' active':''}" id="pg-master">
    <div style="margin-bottom:14px"><span class="stit">All projects &#8212; ${tasks.length} task${tasks.length!==1?'s':''}</span></div>
    ${fbarHtml(tasks,true)}${legend()}${ganttHtml(tasks)}${tblHtml(tasks,true)}</div>`;
  ps.forEach(p=>{
    const pt=tasks.filter(t=>t.project===p);
    html+=`<div class="gpage${curTab===p?' active':''}" id="pg-${p.replace(/[^a-z0-9]/gi,'_')}">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:13px">
        <span style="width:4px;height:19px;background:#FE7400;border-radius:2px;display:inline-block"></span>
        <span style="font-size:14px;font-weight:500;color:var(--text-primary)">${p}</span>
        <span style="font-size:11px;color:var(--text-muted)">${pt.length} task${pt.length!==1?'s':''}</span>
      </div>
      ${fbarHtml(pt)}${legend()}${ganttHtml(pt)}${tblHtml(pt,false)}</div>`;
  });
  document.getElementById('pages').innerHTML=html;
  document.addEventListener('click',closeMs,{once:true});
}
window.setTab = p => {
  closePopup();
  curTab=p;
  // Project highlight filter only makes sense on All Projects / My Tasks tabs
  if(p !== 'master' && p !== 'mytasks') filt.project = '';
  render();
};

// ── People manager ────────────────────────────────────────────
window.closePM = () => { setMC(''); render(); };
window.openPM = () => { if(!isAdmin){needAdmin();return;} setMC(buildPM()); };
function memberRow(m,i){
  const emailVal=(m.email||'').replace(/"/g,'&quot;');
  return `<div class="prow" id="pr-${i}" style="flex-wrap:wrap;gap:5px;align-items:center">
    <div class="pavt">${inits(m.name)}</div>
    <span class="pname" id="pn-${i}" style="min-width:100px">${m.name}</span>
    <span class="pemail-lbl">Login email:</span>
    <input class="pemail" id="pe-${i}" type="email" value="${emailVal}" placeholder="user@envoltz.com"
      title="Firebase login email for this person — enables My Tasks tab"
      onblur="saveEmail(${i},this.value)"
      onkeydown="if(event.key==='Enter')this.blur()">
    <button class="dbtn" onclick="editP(${i})" style="font-size:12px;opacity:.6">&#9998;</button>
    <button class="dbtn" onclick="delP(${i})">&#x2715;</button>
  </div>`;
}
function buildPM() {
  const rows=team.map((m,i)=>memberRow(m,i)).join('');
  return `<div class="mbg" id="mbg" onclick="bgcl(event)"><div class="mbox" style="width:500px">
    <div class="mhdr"><div class="obar"></div><h3>Manage team members</h3></div>
    <p class="spnote">Set each person\'s <strong>Login email</strong> to link their Firebase account to the "My Tasks" tab. Changes are saved instantly for all users.</p>
    <div class="plist" id="plist">${rows}</div>
    <div class="aprow"><input type="text" id="npi" placeholder="Full name" onkeydown="if(event.key===\'Enter\')addP()"><button class="badd" onclick="addP()">+ Add</button></div>
    <div class="mact" style="margin-top:1.1rem"><button class="bprim" onclick="closePM()">Done</button></div>
  </div></div>`;
}
function rebuildPList() {
  document.getElementById('plist').innerHTML=team.map((m,i)=>memberRow(m,i)).join('');
}
window.addP = async () => {
  const inp = document.getElementById('npi');
  if(!inp) return;
  const name = inp.value.trim();
  if(!name) return;
  if(team.some(m => m.name === name)) {
    inp.style.borderColor = '#E24B4A';
    setTimeout(() => inp.style.borderColor = '', 1200);
    return;
  }
  inp.value = '';          // clear immediately so user can type the next one
  inp.focus();
  await addMember(name);   // Firestore write → onSnapshot fires → rebuildPList() called automatically
};
window.delP = async i => {
  const m = team[i];
  // Remove this person from any task assignee lists
  const affected = tasks.filter(t => (t.assignees||[]).includes(m.name));
  for(const t of affected) await updateTask(t.id, {assignees: t.assignees.filter(a => a !== m.name)});
  await deleteMember(m.id);
  // onSnapshot fires → team array updates → rebuildPList() called automatically
};
window.editP = i => {
  const o=team[i].name, s=document.getElementById(`pn-${i}`);
  if(s)s.outerHTML=`<input class="pei" id="pn-${i}" value="${o}" onkeydown="if(event.key==='Enter')saveP(${i});if(event.key==='Escape')cancelP(${i},'${o.replace(/'/g,"\\'")}');" onblur="saveP(${i})">`;
  const inp=document.getElementById(`pn-${i}`); if(inp){inp.focus();inp.select();}
};
window.saveP = async i => {
  const inp=document.getElementById(`pn-${i}`); if(!inp)return;
  const nv=inp.value.trim(); if(!nv){inp.focus();return;}
  const old=team[i].name, id=team[i].id;
  inp.outerHTML=`<span class="pname" id="pn-${i}">${nv}</span>`;
  const av=document.querySelector(`#pr-${i} .pavt`); if(av)av.textContent=inits(nv);
  const affected=tasks.filter(t=>(t.assignees||[]).includes(old));
  for(const t of affected) await updateTask(t.id,{assignees:t.assignees.map(a=>a===old?nv:a)});
  await updateMember(id,{name:nv});
};
// Save email linkage for a team member
window.saveEmail = async (i, email) => {
  const id = team[i].id;
  team[i].email = email.trim();
  await updateMember(id, {email: email.trim()});
};
window.cancelP = (i,o) => {
  const inp=document.getElementById(`pn-${i}`); if(inp)inp.outerHTML=`<span class="pname" id="pn-${i}">${o}</span>`;
};

// ── Add task ──────────────────────────────────────────────────
window.closeAdd = () => setMC('');
// Sync due date to match start date only if due date is still at its default
// (i.e. user hasn't manually changed it yet)
window.syncDueDate = (startVal) => {
  const fed = document.getElementById('fed');
  if(!fed) return;
  // Only auto-update if due date is still <= old start date (user hasn't picked a later end)
  if(!fed.dataset.userChanged) fed.value = startVal;
};
// Mark due date as user-changed once they touch it
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'fed') e.target.dataset.userChanged = '1';
}, true);
window.openAdd = () => {
  if(!isAdmin){needAdmin();return;}
  const today=new Date().toISOString().split('T')[0], ps=getProjs();
  setMC(`<div class="mbg" id="mbg" onclick="bgcl(event)"><div class="mbox">
    <div class="mhdr"><div class="obar"></div><h3>Add new task</h3></div>
    <div class="mf"><label>Task name</label><input type="text" id="fn" placeholder="e.g. Design review"></div>
    <div class="mf"><label>Project number</label><input type="text" id="fp" list="fpl" placeholder="e.g. PRJ-004"><datalist id="fpl">${ps.map(p=>`<option value="${p}">`).join('')}</datalist></div>
    <div class="mf"><label>Task type</label><div class="mms">${TTYPES.map(t=>`<label><input type="checkbox" name="ft" value="${t}"> ${t}</label>`).join('')}</div></div>
    <div class="mf"><label>Assigned to</label><div class="mms">${teamNames().map(m=>`<label><input type="checkbox" name="fa" value="${m}"> ${m}</label>`).join('')}</div></div>
    <div class="mf"><label>Start date</label><input type="date" id="fsd" value="${today}" onchange="syncDueDate(this.value)"></div>
    <div class="mf"><label>Due date</label><input type="date" id="fed" value="${today}"></div>
    <div class="mf"><label>Priority</label><select id="fpr">${PRIOS.map(p=>`<option value="${p}">${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></div>
    <div class="mf"><label>Status</label><select id="fst">${STATUSES.map(s=>`<option value="${s.val}">${s.label}</option>`).join('')}</select></div>
    <div class="mact"><button class="bcanc" onclick="closeAdd()">Cancel</button><button class="bprim" onclick="subTask()">Add task</button></div>
  </div></div>`);
};
window.subTask = async () => {
  if(!isAdmin)return;
  const name=document.getElementById('fn').value.trim(), proj=document.getElementById('fp').value.trim();
  const start=document.getElementById('fsd').value, end=document.getElementById('fed').value;
  const priority=document.getElementById('fpr').value;
  const status=document.getElementById('fst').value||'not_started';
  const types=[...document.querySelectorAll('input[name=ft]:checked')].map(c=>c.value);
  const assignees=[...document.querySelectorAll('input[name=fa]:checked')].map(c=>c.value);
  if(!name||!proj||!start||!end){alert('Please fill in all required fields.');return;}
  if(end<start){alert('Due date must be on or after start date.');return;}
  setMC(''); curTab=proj;
  await addTask({name,project:proj,start,end,priority,status,types,assignees});
};

// ── Boot ──────────────────────────────────────────────────────
// Restore saved theme immediately so there's no flash of wrong theme on load
(function() {
  try {
    const saved = localStorage.getItem('ev-gantt-theme');
    if(saved === 'dark') {
      document.getElementById('app-wrap').setAttribute('data-theme', 'dark');
      document.getElementById('theme-lbl').textContent = 'Dark';
      const tog = document.getElementById('theme-tog');
      if(tog) tog.checked = true;
    }
  } catch(e) {}
})();
showLoad('Checking sign-in status...');
</script>
